<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Messa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="authView" class="auth">
  <div class="auth-card">
    <div class="brand">💬 Messa</div>
    <p class="muted">Közösség és üzenetküldés egy helyen.</p>
    <div class="tabs"><button id="loginTab" class="active">Bejelentkezés</button><button id="signupTab">Regisztráció</button></div>
    <form id="authForm">
      <div id="usernameField" class="field hidden"><label>Felhasználónév</label><input id="username" autocomplete="username"></div>
      <div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Jelszó</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div>
      <div id="confirmField" class="field hidden"><label>Jelszó újra</label><input id="confirm" type="password" minlength="6" autocomplete="new-password"></div>
      <button id="authBtn" class="primary full">Bejelentkezés</button>
      <div id="authMsg" class="msg hidden"></div>
    </form>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand-small">💬 Messa</div>
      <nav class="nav">
        <button data-view="home">🏠 Kezdőlap</button>
        <button data-view="messages">💬 Üzenetek</button>
        <button data-view="communities">👥 Közösségek</button>
        <button data-view="notifications">🔔 Értesítések</button>
        <button data-view="profile">👤 Profil</button>
        <button data-view="settings">⚙️ Beállítások</button>
      </nav>
      <div class="account">
        <div class="user-row"><div id="sideAvatar" class="avatar"></div><div><b id="sideName"></b><div class="muted" id="sideEmail"></div></div></div>
        <button id="logoutBtn" class="secondary full logout">Kijelentkezés</button>
      </div>
    </aside>
    <main class="content" id="content"></main>
    <aside class="rightbar">
      <h3>Fiókod</h3>
      <div class="user-row"><div id="rightAvatar" class="avatar"></div><div><b id="rightName"></b><div class="muted">Messa</div></div></div>
      <hr><div class="muted">A Messa a saját, valódi adataidat jeleníti meg.</div>
    </aside>
  </div>
  <nav class="mobile-nav">
    <button data-view="home">🏠<br>Főoldal</button><button data-view="messages">💬<br>Chat</button><button data-view="communities">👥<br>Közösség</button><button data-view="notifications">🔔<br>Értesítés</button><button data-view="profile">👤<br>Profil</button>
  </nav>
</div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body>
</html>
